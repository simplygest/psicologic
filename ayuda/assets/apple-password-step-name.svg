<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Generar una contraseña de aplicación en Apple</title>
  <desc id="desc">Ejemplo visual de la ventana de Apple para poner nombre a una contraseña de aplicación.</desc>
  <rect width="760" height="520" fill="#f1f2f7"/>
  <rect x="110" y="55" width="540" height="390" rx="18" fill="#fff"/>
  <circle cx="380" cy="118" r="34" fill="#f8f8fb" stroke="#111" stroke-width="4" stroke-dasharray="4 6"/>
  <text x="380" y="124" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Apple</text>
  <text x="380" y="190" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" text-anchor="middle" fill="#111">Generar una contraseña de aplicación</text>
  <text x="380" y="236" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="#697080">Usa una contraseña de aplicación para iniciar sesión en</text>
  <text x="380" y="260" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="#697080">una app o servicio no ofrecido por Apple.</text>
  <rect x="160" y="300" width="440" height="70" rx="12" fill="#fff" stroke="#0875e1" stroke-width="3"/>
  <text x="180" y="328" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6b7280">Ejemplo: Bill Pay</text>
  <text x="180" y="354" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#111">SimplyGest Praxis</text>
  <rect x="160" y="405" width="215" height="58" rx="10" fill="#fff" stroke="#0875e1" stroke-width="2"/>
  <text x="268" y="441" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="#0875e1">Cancelar</text>
  <rect x="390" y="405" width="210" height="58" rx="10" fill="#0875e1"/>
  <text x="495" y="441" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">Crear</text>
</svg>
