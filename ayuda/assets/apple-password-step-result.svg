<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Contraseña de aplicación generada</title>
  <desc id="desc">Ejemplo visual de la ventana de Apple mostrando una contraseña de aplicación creada.</desc>
  <rect width="760" height="520" fill="#f1f2f7"/>
  <rect x="120" y="40" width="520" height="430" rx="18" fill="#fff"/>
  <circle cx="380" cy="105" r="34" fill="#f8f8fb" stroke="#111" stroke-width="4" stroke-dasharray="4 6"/>
  <text x="380" y="109" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Apple</text>
  <text x="380" y="170" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#111">Tu contraseña de aplicación es:</text>
  <text x="380" y="220" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" text-anchor="middle" fill="#111">abcd-tgkl-efgh-ijkw</text>
  <text x="380" y="275" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="#697080">Ingresa la contraseña en el campo correspondiente de la</text>
  <text x="380" y="300" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="#697080">app en la que deseas iniciar sesión. La contraseña</text>
  <text x="380" y="325" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="#697080">distingue entre mayúsculas y minúsculas.</text>
  <rect x="285" y="385" width="250" height="58" rx="10" fill="#0875e1"/>
  <text x="410" y="421" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">Listo</text>
</svg>
